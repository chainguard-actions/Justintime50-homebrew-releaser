name: Test formula customization inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          homebrew_owner: test-owner
          homebrew_tap: homebrew-test
          formula_folder: Formula
          branch: main
          github_token: ${{ github.token }}
          install: |
            bin.install "my-tool"
          download_strategy: CurlDownloadStrategy
          custom_require: custom_download_strategy
          formula_includes: |
            desc "A test formula"
          version: "1.0.0"
          skip_commit: 'true'
          skip_checksum: 'true'
          debug: 'true'
          ignore_warnings: 'true'
        continue-on-error: true
      - name: Assert action ran
        run: |
          echo "Action completed (skip_commit=true prevents actual tap commits)"
          echo "Inputs covered: branch, download_strategy, custom_require, formula_includes"
          echo "PASS"
