name: update-stable

on:
  release:
    types: [published]
  workflow_dispatch: ~

permissions: {}

jobs:
  update-stable:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: '0'
      - name: Update stable git tag
        run: |
          git tag --force $STABLE_TAG ${GITHUB_REF##*/}
          git push origin --force $STABLE_TAG
        env:
          STABLE_TAG: v3
