name: Test custom tarball input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run homebrew-releaser with custom tarball
        id: action
        uses: .
        with:
          homebrew_owner: "test-owner"
          homebrew_tap: "homebrew-test"
          formula_folder: "Formula"
          github_token: ${{ secrets.GITHUB_TOKEN }}
          install: 'bin.install "my-tool"'
          custom_tarball: "https://github.com/test-owner/my-tool/archive/refs/tags/v1.0.0.tar.gz"
          version: "1.0.0"
          skip_commit: "true"
          skip_checksum: "true"
          debug: "true"
        continue-on-error: true
      - name: Assert action ran with custom tarball
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should run (success or failure), but must not be skipped or cancelled.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with custom tarball (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
