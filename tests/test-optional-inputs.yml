name: Test optional inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run homebrew-releaser with optional inputs
        id: action
        uses: .
        continue-on-error: true
        with:
          homebrew_owner: Homebrew
          homebrew_tap: homebrew-core
          formula_folder: Formula
          github_token: ${{ secrets.GITHUB_TOKEN }}
          commit_owner: "Test Bot"
          commit_email: "testbot@example.com"
          depends_on: |
            "openssl@3"
            "libffi"
          install: |
            bin.install "my-tool"
          test: |
            system "#{bin}/my-tool", "--version"
          skip_commit: "true"
          version: "3.1.0"
          debug: "true"
      - name: Assert action attempted to run
        run: |
          echo "Action step outcome: ${{ steps.action.outcome }}"
          # The action makes real GitHub API calls and requires a real latest release.
          # It is expected to fail in a test environment without a real release.
          # We verify the action was invoked (outcome is set, not skipped).
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action step was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action was invoked (outcome: ${{ steps.action.outcome }})"
