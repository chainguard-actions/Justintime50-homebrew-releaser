name: Test debug mode with skip_commit
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run homebrew-releaser in debug mode
        id: action
        uses: .
        with:
          homebrew_owner: "test-owner"
          homebrew_tap: "homebrew-test"
          github_token: ${{ secrets.GITHUB_TOKEN }}
          install: 'bin.install "my-tool"'
          skip_commit: "true"
          skip_checksum: "true"
          debug: "true"
        continue-on-error: true
      - name: Assert action ran in debug mode
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should run (success or failure due to no release assets),
          # but must not be skipped or cancelled.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran in debug mode (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
