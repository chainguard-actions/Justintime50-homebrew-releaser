name: Test multi-arch target inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          homebrew_owner: "test-owner"
          homebrew_tap: "homebrew-test"
          formula_folder: "Formula"
          github_token: ${{ secrets.GITHUB_TOKEN }}
          install: 'bin.install "my-tool"'
          skip_commit: "true"
          debug: "true"
          version: "1.0.0"
          target_darwin_amd64: "https://github.com/test-owner/my-tool/releases/download/v1.0.0/my-tool-darwin-amd64.tar.gz,abc123def456"
          target_darwin_arm64: "https://github.com/test-owner/my-tool/releases/download/v1.0.0/my-tool-darwin-arm64.tar.gz,def456abc123"
          target_linux_amd64: "https://github.com/test-owner/my-tool/releases/download/v1.0.0/my-tool-linux-amd64.tar.gz,111222333444"
          target_linux_arm64: "https://github.com/test-owner/my-tool/releases/download/v1.0.0/my-tool-linux-arm64.tar.gz,444333222111"
        continue-on-error: true
      - name: Assert action ran with multi-arch target inputs
        run: |
          echo "Action completed (skip_commit=true, may fail on tap access but inputs were accepted)"
          echo "PASS: multi-arch target inputs were passed to the action"
