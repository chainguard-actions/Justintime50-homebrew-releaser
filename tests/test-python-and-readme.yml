name: Test python resources and readme table inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          homebrew_owner: "test-owner"
          homebrew_tap: "homebrew-test"
          formula_folder: "Formula"
          github_token: ${{ secrets.GITHUB_TOKEN }}
          install: 'bin.install "my-tool"'
          skip_commit: "true"
          debug: "true"
          version: "1.0.0"
          update_python_resources: "true"
          update_readme_table: "true"
        continue-on-error: true
      - name: Assert action ran with python resources and readme table inputs
        run: |
          echo "Action completed (skip_commit=true, may fail on tap access but inputs were accepted)"
          echo "PASS: update_python_resources and update_readme_table inputs were passed to the action"
