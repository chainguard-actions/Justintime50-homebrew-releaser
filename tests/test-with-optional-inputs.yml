name: Test optional inputs (depends_on, test, commit info)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/tags/v1.2.3
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          homebrew_owner: testowner
          homebrew_tap: homebrew-tap
          formula_folder: Formula
          github_token: fake-token-for-skip-commit
          commit_owner: "Test Bot"
          commit_email: "testbot@example.com"
          depends_on: |
            "openssl@3"
            "libsodium"
          install: 'bin.install "my-tool"'
          test: 'system "#{bin}/my-tool", "--version"'
          skip_commit: "true"
          skip_checksum: "true"
          debug: "true"
        continue-on-error: true
      - name: Assert action ran with optional inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should attempt to run with optional inputs provided.
          # It may fail when trying to authenticate with GitHub API using the fake token,
          # but it should not be skipped or cancelled.
          if [ "$OUTCOME" = "skipped" ] || [ "$OUTCOME" = "cancelled" ]; then
            echo "FAIL: action was skipped or cancelled unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with outcome=$OUTCOME"
