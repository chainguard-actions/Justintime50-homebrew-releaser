name: Test custom architecture targets
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          homebrew_owner: testowner
          homebrew_tap: homebrew-test
          formula_folder: Formula
          github_token: ${{ github.token }}
          commit_owner: homebrew-releaser
          commit_email: homebrew-releaser@example.com
          install: |
            bin.install "my-tool"
          target_darwin_amd64: 'https://example.com/my-tool-darwin-amd64.tar.gz|abc123checksum'
          target_darwin_arm64: 'https://example.com/my-tool-darwin-arm64.tar.gz|def456checksum'
          target_linux_amd64: 'https://example.com/my-tool-linux-amd64.tar.gz|ghi789checksum'
          target_linux_arm64: 'https://example.com/my-tool-linux-arm64.tar.gz|jkl012checksum'
          skip_commit: 'true'
          skip_checksum: 'true'
          debug: 'true'
          ignore_warnings: 'true'

      - name: Assert action ran (success or graceful failure on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with custom targets"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
