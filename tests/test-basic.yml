name: Test basic usage with skip_commit
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_REPOSITORY: justintime50/homebrew-releaser
        with:
          homebrew_owner: justintime50
          homebrew_tap: homebrew-formulas
          formula_folder: Formula
          github_token: ${{ secrets.GITHUB_TOKEN }}
          install: |
            bin.install "homebrew-releaser"
          skip_commit: 'true'
          skip_checksum: 'true'
          debug: 'true'
          ignore_warnings: 'true'
          version: 'v3.3.0'
      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action may fail due to external resource constraints (homebrew tap clone,
          # GitHub API rate limits, etc.) but it should not be skipped.
          # We verify the Docker container ran (outcome is success or failure, not skipped).
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran (outcome=$OUTCOME)"
