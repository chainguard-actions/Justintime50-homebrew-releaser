name: Test custom platform targets
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run homebrew-releaser with custom targets
        id: action
        uses: .
        continue-on-error: true
        with:
          homebrew_owner: Homebrew
          homebrew_tap: homebrew-core
          formula_folder: Formula
          github_token: ${{ secrets.GITHUB_TOKEN }}
          install: |
            bin.install "my-tool"
          skip_commit: "true"
          version: "2.0.0"
          target_darwin_amd64: "https://example.com/my-tool-2.0.0-darwin-amd64.tar.gz,abc123def456abc123def456abc123def456abc123def456abc123def456abc1"
          target_darwin_arm64: "https://example.com/my-tool-2.0.0-darwin-arm64.tar.gz,def456abc123def456abc123def456abc123def456abc123def456abc123def4"
          target_linux_amd64: "https://example.com/my-tool-2.0.0-linux-amd64.tar.gz,111222333444555666777888999000aaabbbcccdddeeefff000999888777666"
          target_linux_arm64: "https://example.com/my-tool-2.0.0-linux-arm64.tar.gz,aaabbbcccdddeeefff000999888777666555444333222111000aaabbbcccddd"
          debug: "true"
      - name: Assert action attempted to run
        run: |
          echo "Action step outcome: ${{ steps.action.outcome }}"
          # The action makes real GitHub API calls and requires a real latest release.
          # It is expected to fail in a test environment without a real release.
          # We verify the action was invoked (outcome is set, not skipped).
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action step was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action was invoked (outcome: ${{ steps.action.outcome }})"
