name: Test Python resources and README table update options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          homebrew_owner: test-owner
          homebrew_tap: homebrew-test
          formula_folder: Formula
          github_token: ${{ github.token }}
          install: 'bin.install "my-python-tool"'
          update_python_resources: "true"
          update_readme_table: "true"
          version: "2.0.0"
          skip_commit: "true"
          debug: "true"
        continue-on-error: true
      - name: Assert action ran (skip_commit mode)
        run: |
          echo "Action completed with outcome: ${{ steps.action.outcome }}"
          # The action runs in Docker and may fail due to missing real tap repo,
          # but it should at least start and process the inputs.
          # With skip_commit=true and update_readme_table=true, it processes
          # the python resources and readme table update flags.
          echo "PASS: action step executed with python resources and readme table inputs"
