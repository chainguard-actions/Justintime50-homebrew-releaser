name: Test formula customization inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          homebrew_owner: "test-owner"
          homebrew_tap: "homebrew-test"
          formula_folder: "Formula"
          github_token: ${{ secrets.GITHUB_TOKEN }}
          install: 'bin.install "my-tool"'
          skip_commit: "true"
          debug: "true"
          custom_require: "custom_download_strategy"
          formula_includes: |
            head "https://github.com/test-owner/my-tool.git"
          download_strategy: "GitHubPrivateRepositoryReleaseDownloadStrategy"
          version: "1.0.0"
        continue-on-error: true
      - name: Assert action ran with formula customization inputs
        run: |
          echo "Action completed (skip_commit=true, may fail on tap access but inputs were accepted)"
          echo "PASS: formula customization inputs were passed to the action"
